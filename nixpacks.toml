# Adds Python (for python/sarima_forecast.py) alongside Nixpacks' auto-detected
# PHP/Node build.
#
# IMPORTANT: a first attempt set cmds under [phases.install] expecting them to
# append to the auto-detected composer install / npm ci - instead Nixpacks
# REPLACED that phase's cmds entirely, so composer/npm never ran and the
# build failed (npm run build: vite not found, exit 127). Fixed by using a
# separate, not-otherwise-used phase name so [phases.install] and
# [phases.build] are never touched - their auto-detected cmds stay intact.
#
# The venv is built at python/venv to match what
# ProductController::resolvePythonBinary() and
# SalesController::resolvePythonBinary() already look for first - no app code
# needs to change for this to take effect.

[phases.setup]
nixPkgs = ["python312"]

[phases.python-deps]
dependsOn = ["install"]
cmds = [
    "python3 -m venv python/venv",
    "python/venv/bin/pip install --no-cache-dir -r python/requirements.txt"
]
