# Adds Python (for python/sarima_forecast.py) alongside Nixpacks' auto-detected
# PHP/Node build.
#
# Both [phases.install].cmds and [phases.setup].nixPkgs were tried first and
# both turned out to REPLACE the auto-detected PHP/Node config for that key,
# not append to it:
#  - cmds under [phases.install] dropped composer install/npm ci entirely
#    (vite not found during npm run build, exit 127).
#  - nixPkgs under [phases.setup] dropped php/composer from the nix
#    environment entirely ("composer: command not found", exit 127).
# Fixed by putting everything Python-related in its own phase that Nixpacks
# never auto-generates, so [phases.setup]/[phases.install]/[phases.build] are
# never touched at all and keep their auto-detected values completely intact.
# nixPkgs declared on any phase still becomes available to the whole build
# (Nixpacks builds one shared nix environment from the union across phases),
# so python3 ends up on PATH everywhere despite being declared here.
#
# The venv is built at python/venv to match what
# ProductController::resolvePythonBinary() and
# SalesController::resolvePythonBinary() already look for first - no app code
# needs to change for this to take effect.

[phases.python-deps]
dependsOn = ["install"]
# stdenv.cc.cc.lib provides libstdc++.so.6 - without it, numpy's compiled
# extensions fail at import with "ImportError: libstdc++.so.6: cannot open
# shared object file" (confirmed in a live container), since a bare python3
# nix package doesn't pull in the C++ runtime scientific wheels link against.
nixPkgs = ["python312", "stdenv.cc.cc.lib"]
cmds = [
    "python3 -m venv python/venv",
    "python/venv/bin/pip install --no-cache-dir -r python/requirements.txt"
]
